<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your email - ForkBench</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #0a0a0a;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 480px;">
          <!-- Logo/Brand -->
          <tr>
            <td align="center" style="padding-bottom: 32px;">
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="padding-right: 8px; vertical-align: middle;">
                    <svg width="24" height="24" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                      <g stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="8" y="18" width="6" height="6" rx="1.5" />
                        <rect x="24" y="10" width="6" height="6" rx="1.5" />
                        <rect x="24" y="18" width="6" height="6" rx="1.5" />
                        <rect x="24" y="26" width="6" height="6" rx="1.5" />
                        <path d="M 14 21 C 18 21, 20 15, 24 13 M 14 21 L 24 21 M 14 21 C 18 21, 20 27, 24 29" />
                      </g>
                    </svg>
                  </td>
                  <td style="vertical-align: middle;">
                    <span style="font-size: 20px; font-weight: 600; color: #ffffff; letter-spacing: -0.025em;">ForkBench</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Main Card -->
          <tr>
            <td style="background-color: #141414; border: 1px solid #1a1a1a; border-radius: 12px; padding: 32px;">
              <!-- Header -->
              <h2 style="margin: 0 0 16px 0; font-size: 24px; font-weight: 600; color: #ffffff;">Confirm your email</h2>

              <!-- Body Text -->
              <p style="margin: 0 0 24px 0; font-size: 14px; line-height: 1.6; color: #b3b3b3;">
                Click the button below to confirm your new email address for ForkBench and start comparing AI models side-by-side.
              </p>

              <!-- CTA Button -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" style="padding: 8px 0;">
                    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #ffffff; color: #0a0a0a; font-size: 14px; font-weight: 600; text-decoration: none; padding: 12px 32px; border-radius: 9999px;">
                      Confirm Email
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Secondary Text -->
              <p style="margin: 24px 0 0 0; font-size: 12px; line-height: 1.5; color: #666666;">
                If you didn't request this change, you can safely ignore this email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top: 32px;">
              <p style="margin: 0; font-size: 12px; color: #666666;">
                ForkBench - Compare AI Models Side-by-Side
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
